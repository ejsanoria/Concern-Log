<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Client concern log</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --ink: #1d2b3a; --muted: #5d6b7a; --line: #d6dde4;
    --paper: #f6f8fa; --card: #ffffff;
    --open: #b8640f; --open-bg: #fdf1e3;
    --closed: #2a7563; --closed-bg: #e5f3ef;
    --danger: #a3302a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: 'Public Sans', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    font-size: 15px; line-height: 1.5;
  }
  .hidden { display: none !important; }

  /* ---------- Login ---------- */
  .login-screen { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
  .login-card {
    width: 100%; max-width: 380px; background: var(--card);
    border: 1px solid var(--line); border-top: 5px solid var(--ink);
    border-radius: 8px; padding: 30px 28px;
  }
  .login-card h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .login-card .sub { color: var(--muted); margin: 0 0 18px; }
  .login-error { color: var(--danger); font-size: 14px; margin: 12px 0 0; min-height: 1em; }
  .login-card .btn.primary { margin-top: 20px; }

  /* ---------- App ---------- */
  .shell { max-width: 1180px; margin: 0 auto; padding: 32px 24px 64px; }
  .masthead {
    display: flex; align-items: baseline; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
    border-bottom: 3px solid var(--ink); padding-bottom: 14px; margin-bottom: 24px;
  }
  .masthead h1 { font-size: 30px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .mast-right { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .tally { margin: 0; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .tally strong { color: var(--ink); font-size: 20px; }
  #openCount { color: var(--open); }
  .sep { width: 1px; height: 18px; background: var(--line); margin: 0 10px; }
  .who { color: var(--muted); font-size: 14px; display: flex; align-items: center; gap: 10px; }
  .who .link { margin: 0; }

  .alert {
    display: none; justify-content: space-between; gap: 16px; align-items: center;
    background: #fbeceb; color: var(--danger); border-left: 4px solid var(--danger);
    padding: 10px 14px; margin-bottom: 20px; border-radius: 4px;
  }
  .alert.show { display: flex; }

  .grid { display: grid; grid-template-columns: 360px 1fr; gap: 28px; align-items: start; }
  h2 { font-size: 17px; margin: 0 0 16px; }

  .intake {
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
    padding: 22px; position: sticky; top: 20px;
  }
  label { display: block; font-weight: 500; margin: 14px 0 6px; }
  select, input, textarea {
    width: 100%; font: inherit; color: inherit;
    border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; background: #fff;
  }
  textarea { resize: vertical; }
  select:focus, input:focus, textarea:focus, button:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .inline { display: none; gap: 8px; align-items: center; }
  .inline.show { display: flex; }
  .inline input { flex: 1; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 16px; }

  .btn { font: inherit; font-weight: 500; cursor: pointer; border-radius: 6px; padding: 9px 16px; border: 1px solid transparent; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .btn.primary { width: 100%; background: var(--ink); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: #2c3f53; }
  .btn.ghost { background: #fff; border-color: var(--line); color: var(--ink); }
  .btn.close { background: var(--closed); color: #fff; }
  .link {
    background: none; border: none; padding: 0; margin-top: 6px;
    font: inherit; font-size: 13px; color: var(--muted); text-decoration: underline; cursor: pointer;
  }
  .alert .link { margin: 0; color: inherit; }

  .log-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .log-head h2 { margin: 0; }
  .tabs { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #fff; }
  .tab { font: inherit; border: none; background: none; padding: 6px 14px; cursor: pointer; color: var(--muted); }
  .tab + .tab { border-left: 1px solid var(--line); }
  .tab.on { background: var(--ink); color: #fff; }
  .search { margin: 14px 0; }

  .entries { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
  .entry {
    display: flex; gap: 16px; align-items: center;
    background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--open);
    border-radius: 6px; padding: 14px 16px;
  }
  .entry.closed { border-left-color: var(--closed); }
  .entry.closed .text { color: var(--muted); }
  .entry-main { flex: 1; min-width: 0; }
  .entry-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .client { font-weight: 700; }
  .pill { font-size: 12px; font-weight: 500; padding: 1px 9px; border-radius: 999px; }
  .pill.open { background: var(--open-bg); color: var(--open); }
  .pill.closed { background: var(--closed-bg); color: var(--closed); }
  .text { margin: 6px 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dates { margin: 0; font-size: 13px; color: var(--muted); }
  .empty { color: var(--muted); text-align: center; padding: 40px 16px; border: 1px dashed var(--line); border-radius: 6px; }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
    .intake { position: static; }
    .entry { flex-direction: column; align-items: stretch; }
    .entry-action .btn { width: 100%; }
  }
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div class="login-screen hidden" id="loginView">
  <form class="login-card" id="loginForm" novalidate>
    <h1>Client concern log</h1>
    <p class="sub">Sign in with your company email.</p>

    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="username" required />

    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required />

    <button class="btn primary" id="loginBtn" type="submit">Sign in</button>
    <p class="login-error" id="loginError" role="alert"></p>
  </form>
</div>

<!-- ================= APP ================= -->
<main class="shell hidden" id="appView">
  <header class="masthead">
    <h1>Client concern log</h1>
    <div class="mast-right">
      <p class="tally">
        <strong id="openCount">0</strong> open
        <span class="sep" aria-hidden="true"></span>
        <strong id="closedCount">0</strong> closed
      </p>
      <div class="who">
        <span id="userEmail"></span>
        <button class="link" id="logoutBtn">Sign out</button>
      </div>
    </div>
  </header>

  <div class="alert" id="alert" role="alert">
    <span id="alertText"></span>
    <button class="link" id="dismissBtn">Dismiss</button>
  </div>

  <div class="grid">
    <section class="intake" aria-labelledby="intake-h">
      <h2 id="intake-h">Log a new concern</h2>

      <label for="clientSelect">Client</label>
      <div id="selectWrap">
        <select id="clientSelect">
          <option value="">Select the client raising the concern</option>
        </select>
        <button class="link" id="showAddClient">Client not listed? Add one</button>
      </div>
      <div class="inline" id="addClientWrap">
        <input id="newClient" placeholder="New client name" />
        <button class="btn ghost" id="addClientBtn">Add</button>
        <button class="link" id="cancelAddClient">Cancel</button>
      </div>

      <label for="concernText">Concern</label>
      <textarea id="concernText" rows="6"
        placeholder="What did the client escalate? Include shipment, site, or reference numbers if any."></textarea>

      <p class="hint">The escalation date and your name are recorded automatically. The concern starts as Open.</p>

      <button class="btn primary" id="logBtn">Log concern</button>
    </section>

    <section class="log" aria-labelledby="log-h">
      <div class="log-head">
        <h2 id="log-h">Concerns</h2>
        <div class="tabs" role="tablist">
          <button class="tab on" role="tab" data-filter="Open" aria-selected="true">Open</button>
          <button class="tab" role="tab" data-filter="Closed" aria-selected="false">Closed</button>
          <button class="tab" role="tab" data-filter="All" aria-selected="false">All</button>
        </div>
      </div>

      <input class="search" id="search" type="search" placeholder="Search by client or concern" />

      <div id="list"><p class="empty">Loading concerns…</p></div>
    </section>
  </div>
</main>

<script>
  // ---- Supabase connection ----
  const SUPABASE_URL = 'https://kyptnxwcqiniaeqzdbrm.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_TFrnGaNO5Hfb2Z3AQ54Kyg_TbO2q-u3';
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const FIELDS = 'id, client_id, concern, escalation_date, status, closed_at, logged_by, closed_by, clients(name)';

  // ---- State ----
  let clients = [];
  let concerns = [];
  let filter = 'Open';
  let search = '';
  let busyId = null;
  let loading = true;
  let currentUser = null;

  // ---- Helpers ----
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = (iso) => iso ? new Date(iso).toLocaleString('en-PH', {
    timeZone: 'Asia/Manila', month: 'short', day: 'numeric', year: 'numeric',
    hour: 'numeric', minute: '2-digit'
  }) : '';
  const who = (email) => email ? email.split('@')[0] : '';

  function showError(msg) { $('alertText').textContent = msg; $('alert').classList.add('show'); }
  function clearError() { $('alert').classList.remove('show'); }

  // ---- Auth ----
  function showLogin() {
    currentUser = null;
    $('appView').classList.add('hidden');
    $('loginView').classList.remove('hidden');
    $('password').value = '';
    $('email').focus();
  }

  function showApp(user) {
    const firstLoad = !currentUser || currentUser.id !== user.id;
    currentUser = user;
    $('userEmail').textContent = user.email;
    $('loginView').classList.add('hidden');
    $('appView').classList.remove('hidden');
    if (firstLoad) load();
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim();
    const password = $('password').value;
    $('loginError').textContent = '';
    if (!email || !password) { $('loginError').textContent = 'Enter your email and password.'; return; }

    const btn = $('loginBtn');
    btn.disabled = true; btn.textContent = 'Signing in…';
    const { error } = await db.auth.signInWithPassword({ email, password });
    btn.disabled = false; btn.textContent = 'Sign in';

    if (error) {
      $('loginError').textContent = error.message === 'Invalid login credentials'
        ? 'Email or password is incorrect.'
        : error.message;
    }
  });

  $('logoutBtn').addEventListener('click', async () => { await db.auth.signOut(); });

  db.auth.onAuthStateChange((_event, session) => {
    if (session?.user) showApp(session.user); else showLogin();
  });

  // ---- Rendering ----
  function renderClients(selectedId) {
    const sel = $('clientSelect');
    const current = selectedId ?? sel.value;
    sel.innerHTML = '<option value="">Select the client raising the concern</option>' +
      clients.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
    sel.value = current || '';
  }

  function renderList() {
    const open = concerns.filter(c => c.status === 'Open').length;
    $('openCount').textContent = open;
    $('closedCount').textContent = concerns.length - open;

    const list = $('list');
    if (loading) { list.innerHTML = '<p class="empty">Loading concerns…</p>'; return; }

    const q = search.trim().toLowerCase();
    const visible = concerns.filter(c => {
      if (filter !== 'All' && c.status !== filter) return false;
      if (!q) return true;
      return c.concern.toLowerCase().includes(q) ||
             (c.clients?.name ?? '').toLowerCase().includes(q);
    });

    if (visible.length === 0) {
      list.innerHTML = `<p class="empty">${concerns.length === 0
        ? 'No concerns logged yet. Use the form to record the first one.'
        : 'No concerns match this view.'}</p>`;
      return;
    }

    list.innerHTML = '<ol class="entries">' + visible.map(c => {
      const s = c.status.toLowerCase();
      const busy = busyId === c.id;
      const action = c.status === 'Open'
        ? `<button class="btn close" data-id="${c.id}" data-to="Closed" ${busy ? 'disabled' : ''}>${busy ? 'Closing…' : 'Close'}</button>`
        : `<button class="btn ghost" data-id="${c.id}" data-to="Open" ${busy ? 'disabled' : ''}>${busy ? 'Reopening…' : 'Reopen'}</button>`;
      const logged = `Escalated ${fmt(c.escalation_date)}${c.logged_by ? ' by ' + esc(who(c.logged_by)) : ''}`;
      const closed = c.closed_at ? ` &nbsp;/&nbsp; Closed ${fmt(c.closed_at)}${c.closed_by ? ' by ' + esc(who(c.closed_by)) : ''}` : '';
      return `
        <li class="entry ${s}">
          <div class="entry-main">
            <div class="entry-top">
              <span class="client">${esc(c.clients?.name ?? 'Unknown client')}</span>
              <span class="pill ${s}">${c.status}</span>
            </div>
            <p class="text">${esc(c.concern)}</p>
            <p class="dates">${logged}${closed}</p>
          </div>
          <div class="entry-action">${action}</div>
        </li>`;
    }).join('') + '</ol>';
  }

  // ---- Data ----
  async function load() {
    loading = true; renderList();
    const [c, k] = await Promise.all([
      db.from('clients').select('id, name').order('name'),
      db.from('concerns').select(FIELDS).order('escalation_date', { ascending: false })
    ]);
    loading = false;
    if (c.error || k.error) {
      showError(`Couldn't load data: ${(c.error || k.error).message}. Check that schema.sql and add-login.sql have been run in Supabase.`);
    } else {
      clients = c.data; concerns = k.data; clearError();
    }
    renderClients(); renderList();
  }

  async function logConcern() {
    const clientId = $('clientSelect').value;
    const text = $('concernText').value.trim();
    if (!clientId || !text) { showError('Pick a client and describe the concern before logging it.'); return; }

    const btn = $('logBtn');
    btn.disabled = true; btn.textContent = 'Logging…';
    // escalation_date, status ('Open') and logged_by are filled in by the database
    const { data, error } = await db.from('concerns')
      .insert({ client_id: Number(clientId), concern: text })
      .select(FIELDS).single();
    btn.disabled = false; btn.textContent = 'Log concern';

    if (error) { showError(`Couldn't log concern: ${error.message}`); return; }
    concerns.unshift(data);
    $('concernText').value = '';
    clearError();
    if (filter === 'Closed') setFilter('Open'); else renderList();
  }

  async function addClient() {
    const name = $('newClient').value.trim();
    if (!name) return;
    const { data, error } = await db.from('clients').insert({ name }).select('id, name').single();
    if (error) {
      showError(error.code === '23505' ? `${name} is already in the client list.` : `Couldn't add client: ${error.message}`);
      return;
    }
    clients.push(data);
    clients.sort((a, b) => a.name.localeCompare(b.name));
    renderClients(String(data.id));
    toggleAddClient(false);
    clearError();
  }

  async function setStatus(id, status) {
    busyId = id; renderList();
    const { data, error } = await db.from('concerns').update({ status }).eq('id', id).select(FIELDS).single();
    busyId = null;
    if (error) { showError(`Couldn't update status: ${error.message}`); renderList(); return; }
    concerns = concerns.map(c => c.id === id ? data : c);
    renderList();
  }

  // ---- UI wiring ----
  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.tab').forEach(t => {
      const on = t.dataset.filter === f;
      t.classList.toggle('on', on);
      t.setAttribute('aria-selected', on);
    });
    renderList();
  }

  function toggleAddClient(show) {
    $('selectWrap').classList.toggle('hidden', show);
    $('addClientWrap').classList.toggle('show', show);
    $('newClient').value = '';
    if (show) $('newClient').focus();
  }

  $('logBtn').addEventListener('click', logConcern);
  $('showAddClient').addEventListener('click', () => toggleAddClient(true));
  $('cancelAddClient').addEventListener('click', () => toggleAddClient(false));
  $('addClientBtn').addEventListener('click', addClient);
  $('newClient').addEventListener('keydown', e => { if (e.key === 'Enter') addClient(); });
  $('dismissBtn').addEventListener('click', clearError);
  $('search').addEventListener('input', e => { search = e.target.value; renderList(); });
  document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setFilter(t.dataset.filter)));
  $('list').addEventListener('click', e => {
    const b = e.target.closest('button[data-id]');
    if (b) setStatus(Number(b.dataset.id), b.dataset.to);
  });
</script>
</body>
</html>
